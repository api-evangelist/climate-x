aid: climate-x
name: Climate-X
description: >-
  Climate X is a London-headquartered climate risk analytics company that
  translates physical climate hazards into financial loss metrics for banks,
  insurers, asset managers, real estate firms, and consultancies. Its Spectra
  product models a range of physical climate hazards across roughly 1.5 billion
  global assets under multiple emissions scenarios and time horizons, delivering
  asset- and portfolio-level annual loss, probability, and severity estimates via
  a web platform, CSV export, BI tools, and an Enterprise API. Additional products
  include Adapt (adaptation capex and ROI), Carta (global asset location and
  exposure mapping), and Adaptation Finance. Climate X is ISO/IEC 27001 and ISO
  14001 certified and a certified B Corporation. The Enterprise API is currently
  gated behind sales, so no public OpenAPI, SDK, or developer portal is available.
